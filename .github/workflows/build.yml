name: Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binary (Unix)
        if: runner.os != 'Windows'
        run: go build -v -ldflags="-s -w" -o splunk-tui .

      - name: Build Binary (Windows)
        if: runner.os == 'Windows'
        run: go build -v -ldflags="-s -w" -o splunk-tui.exe .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splunk-tui-${{ matrix.os }}
          path: |
            splunk-tui
            splunk-tui.exe
          if-no-files-found: error
          retention-days: 14

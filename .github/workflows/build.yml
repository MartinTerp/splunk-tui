name: Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            target: linux-amd64
            bin: splunk-tui
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            target: linux-arm64
            bin: splunk-tui
          - os: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: '7'
            target: linux-armv7
            bin: splunk-tui
          - os: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: '6'
            target: linux-armv6
            bin: splunk-tui
          - os: macos-latest
            goos: darwin
            goarch: arm64
            target: darwin-arm64
            bin: splunk-tui
          - os: macos-latest
            goos: darwin
            goarch: amd64
            target: darwin-amd64
            bin: splunk-tui
          - os: windows-latest
            goos: windows
            goarch: amd64
            target: windows-amd64
            bin: splunk-tui.exe
          - os: windows-latest
            goos: windows
            goarch: arm64
            target: windows-arm64
            bin: splunk-tui.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests
        run: go test -v ./...

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: go build -v -ldflags="-s -w" -o ${{ matrix.bin }} .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splunk-tui-${{ matrix.target }}
          path: ${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 14
